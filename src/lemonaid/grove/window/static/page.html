<style>

<script>
window.onerror = (m, src, line, col) => { try { window.pywebview.api.log(`error ${m} at ${line}:${col}`); } catch (_) {} };
// ---- palette and ports of the terminal grove's shapes (src/lemonaid/grove/draw/) ----
const BG = "#0b0e13", TEXT = "#e6ebf2", TAG = "#4a5260", TRUNK = "#8a6239", TRUNK_SHADE = "#5a3c24", OUTLINE = "#14241a";
const LEAF = ["#2b5230", "#3d7039", "#548f45", "#79b25a"], LEAD_LEAF = ["#33602f", "#4a8540", "#66a850", "#93cc68"];
const STATUS = {alert:"#e5534b", blocked:"#f2c14e", merge:"#5fbf6a", approve:"#c58af9", review:"#a8794f", running:"#39b5a8", done:"#5a8dee"};
const RANK = ["alert", "blocked", "merge", "approve", "review", "running", "done"];
const FLOOR = "#1d1f24", ROOF = "#7a3b2e";

const seedOf = t => t._seed ?? (t._seed = wordHash(t.key) % 9973);
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
function mix(a, b, t) { const x = hex(a), y = hex(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); }

function inset(seed, side, t) {
  const lean = (noise(seed, side + 10) - 0.5) * 0.08 * t, bow = (noise(seed, side + 20) - 0.5) * 0.06 * (1 - t * t);
  return Math.max(0, 0.03 + 0.05 * noise(seed, side) + lean + bow + 0.012 * Math.sin(t * 5 + seed + side));
}
function inside(p, x, y) {
  const hw = p.w / 2, hh = p.h / 2, nx = (x - p.x - hw + 0.5) / hw, ny = (y - p.y - hh + 0.5) / hh;
  const left = -1 + inset(p.seed, 0, ny), right = 1 - inset(p.seed, 1, ny), top = -1 + inset(p.seed, 2, nx), bottom = 1 - inset(p.seed, 3, nx);
  if (!(left <= nx && nx <= right && top <= ny && ny <= bottom)) return false;
  const rows = Math.max(0, Math.min(0.9, 1.3 / p.roundness - 0.1)) * Math.min(hh, hw / 2);
  if (rows <= 0) return true;
  const kx = 2 * rows / hw, ky = rows / hh;
  const dx = Math.max(0, left + kx - nx, nx - (right - kx)) / kx, dy = Math.max(0, top + ky - ny, ny - (bottom - ky)) / ky;
  return dx * dx + dy * dy <= 1;

// Smooth noise, 0 to 1, varying over about a unit: hashed corners blended across each unit square.
function patchy(x, y, seed) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0, ease = f => f * f * (3 - 2 * f);
  const at = (i, j) => noise(x0 + i + seed, y0 + j), u = ease(fx), v = ease(fy);
  return (at(0, 0) * (1 - u) + at(1, 0) * u) * (1 - v) + (at(0, 1) * (1 - u) + at(1, 1) * u) * v;
}
const GAP = 4;
// Smooth noise with no lattice showing: patchy at two scales, each turned off the axes.
const organic = (x, y, seed) => 0.65 * patchy(0.8 * x + 0.6 * y, 0.8 * y - 0.6 * x, seed) + 0.35 * patchy(2.1 * (0.6 * x - 0.8 * y), 2.1 * (0.6 * y + 0.8 * x), seed + 29);
// A leaf cell's shade, 0 darkest to 3 lightest (or a GAP), at (*i*, *j*) cells into a crown: lit from the upper
// left by where it is on the crown (*across* -1 to 1, *low* 0 at the top to 1 at the bottom), and
// broken into leafy patches by noise at two scales, turned off the pixel grid so no rows show.
function leafShade(i, j, across, low, seed) {
  const a = 0.8 * i + 0.6 * j, b = 0.8 * j - 0.6 * i;
  const t = 0.62 - 0.3 * across - 0.55 * (low - 0.4) + 0.5 * (patchy(a / 4, b / 4, seed) - 0.5) + 0.3 * (patchy(a / 1.7, b / 1.7, seed + 77) - 0.5);
  if (t < 0.38 && patchy(a / 2.5, b / 2.5, seed + 151) < 0.1) return GAP;  // now and then a gap into the dark inside

  return t > 0.78 ? 3 : t > 0.48 ? 2 : t > 0.2 ? 1 : 0;
}
const covered = (blobs, dx, dy) => blobs.some(([bx, by, brx, bry]) => ((dx - bx) / brx) ** 2 + ((dy - by) / bry) ** 2 <= 1);

// ---- view ----
const cv = document.getElementById("c"), card = document.getElementById("card"), bg = document.createElement("canvas");
let ctx = cv.getContext("2d");
// Mid-turn lemons and their tags dim and brighten over 4.5 s, as in the terminal grove.
const PULSE_SECONDS = 4.5, PULSE_DEPTH = 0.45, MIN_TEXT = 0.62, MAX_TEXT = 1;  // the smallest and largest label text, against the font
let moving = null;  // a block being moved, or its sides dragged, in the grove view: {b, sides, dx, dy, aim, problem}
const shift = b => moving && moving.b.digit === b.digit && !moving.sides.length ? [moving.dx, moving.dy] : [0, 0];
const phase = () => (1 - Math.cos(2 * Math.PI * Date.now() / 1000 / PULSE_SECONDS)) / 2;
// Label size against the map's text, per view; "-" and "+" (or "=", unshifted) change it, kept by window/settings.py.
let labelScales = {grove: 0.85, block: 0.95};

const labelScale = () => labelScales[zoomed ? "block" : "grove"];
let shown = false;  // the app says when the window is up; nothing animates while it is hidden
let flipped = false, flipKey = ";", flipHold = true;  // the lists' other page, and the key that shows it
let usageKey = "U", usageTimer = 0, usageAsked = 0;  // the inbox's usage table, in a box, while it's open
// Hidden after a jump or a dismissal, it goes back to the whole grove at once, so the next summon
// opens there instead of showing the block it left for a moment.
// Whether the window is over the terminal (window/placement.py): there it hides after a jump; moved
// away it floats, kept where it was left, and a click on the chip puts it back over the terminal.
window.setPlacement = over => {
  const chip = document.getElementById("placement");
  chip.textContent = over ? "over terminal" : "floating";
  chip.className = over ? "" : "floating";
  chip.title = over ? "drag the top bar to move the window away from the terminal" : "click to put the window back over the terminal";
};
document.getElementById("placement").addEventListener("click", () => {
  if (document.getElementById("placement").className === "floating") window.pywebview.api.stick();
});
// The top bar moves the window; Python follows the pointer until it's let go (window/native.py's `drag`).
document.getElementById("top").addEventListener("mousedown", e => {
  if (e.button === 0 && !(e.target.id === "placement" && e.target.className === "floating")) window.pywebview.api.drag();
});
// Back to the whole grove with nothing under way, as it opens after a jump or once hidden.
function wholeGrove() {
  typed = ""; drag = press = moving = search = dot = selecting = focus = null; flipped = false;
  hideUsage(); closeMenus(); help.style.display = "none"; goTo(null);
}
window.setShown = v => {
  shown = v;
  if (!v && DATA) wholeGrove();
  if (DATA) draw();
};
const sprite = document.createElement("canvas");  // a crown or lemon at a pixel a cell, before stamp scales it up
const still = document.createElement("canvas");  // the last full frame, which a pulse frame starts from
let pulsers = {dots: [], tags: []};
let CW = 8, RH = 16, YS = 2, CAP = 9;  // a cell's width, a row's height, their ratio, and a capital's height, from the font
let DATA = null, view = {x: 0, y: 0, k: 8}, zoomed = null, typed = "", hits = [], hover = null;
// A `/` search under way, {text, found, chosen}, and a `.` typed in a block toward a lemon's place, {letter, num}.
let search = null, dot = null, searchAsked = 0;  // searchAsked: the last search Python was asked for; navigating keeps its answer wanted
// `Tab`'s select mode: {mode: "" | "." | "$", letter, num}, what's typed toward a choice, and the view it began in
let selecting = null, selectFrom = null;
let listMarks = [];  // what drawList drew that a click reaches, a lemon's row or a PR, in the list's own pixels
const worst = t => RANK.find(s => t.lemons.some(l => l.status === s)) || "";
const sx = x => (x - view.x) * view.k, sy = y => (y - view.y) * view.k * YS;

function measure() {
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight - 44;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + "px"; cv.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '600 13px "SF Mono", Menlo, monospace';
  CW = ctx.measureText("M").width; RH = Math.round(CW * 2.05); YS = RH / CW; CAP = ctx.measureText("H").actualBoundingBoxAscent;
}
const W = () => cv.width / (devicePixelRatio || 1), H = () => cv.height / (devicePixelRatio || 1);
const screen = () => ({W: W(), H: H(), CW, RH, YS});
// Each view's last pan and zoom, the whole grove's and each block's (by its group), kept between summons
// and restarts; a view with none opens at its own fit.
let views = {}, savingViews = 0;
const viewKey = d => d ? `block:${DATA.blocks.find(b => b.digit === d)?.group || "packhouse"}` : "grove";
// Python keeps them (window/settings.py), a moment after the last change.
function keepSettings() { clearTimeout(savingViews); savingViews = setTimeout(() => window.pywebview.api.keep({views, labelScales}), 300); }
// Kept per window size, since the window takes the size of the terminal it covers: a laptop's screen and
// a monitor's each keep their own views.
const sizeKey = () => `${Math.round(W() / 20) * 20}x${Math.round(H() / 20) * 20}`;
function keepView() { (views[sizeKey()] ??= {})[viewKey(zoomed)] = {x: view.x, y: view.y, k: view.k, W: W(), H: H()}; keepSettings(); }
// The view kept at this size, else the one kept at the nearest size, carried to this one.
function keptView(d) {
  const key = viewKey(d), here = views[sizeKey()]?.[key];
  if (here) return here;

  const near = Object.values(views).map(size => size[key]).filter(v => v && v.W && v.H).sort((a, b) =>
    Math.abs(a.W - W()) + Math.abs(a.H - H()) - Math.abs(b.W - W()) - Math.abs(b.H - H()))[0];
  if (!near) return null;
  const then = {...screen(), W: near.W, H: near.H};
  return carriedView(near, then, screen(), homeView(DATA.blocks, d, then), homeView(DATA.blocks, d, screen()), YS);
}
// A block's kept view is used only while it is one of that block's own views: zoomed in as far as the
// block's band reaches and centered on the block. Otherwise the block opens at its fit.
function usable(d, kept) {
  if (!kept || !d) return !!kept;

  const p = DATA.blocks.find(b => b.digit === d)?.plot, cx = kept.x + W() / 2 / kept.k, cy = kept.y + H() / 2 / (kept.k * YS);
  return !!p && kept.k >= homeView(DATA.blocks, d, screen()).k * 0.55 && cx >= p.x && cx <= p.x + p.w && cy >= p.y && cy <= p.y + p.h;
}
// On a touch screen each view opens at its fit: a kept view can leave a phone zoomed into bare ground
// with no keys to find the way back.
function goTo(d) { zoomed = d; const kept = touch() ? null : keptView(d); view = usable(d, kept) ? {...kept} : homeView(DATA.blocks, d, screen()); }
// On a touch screen, a tap on the top bar goes back to the whole grove.
document.getElementById("top").addEventListener("click", () => {
  if (!touch() || !DATA) return;

  wholeGrove(); draw();
});
let layouts = {};  // by view ("grove" or a block's digit), from layOut
const layout = () => layouts[zoomed || "grove"] ??= layOut(DATA.blocks, zoomed, screen(), labelScale());

// ---- drawing ----
function txt(s, x, y, color, bg, weight) {
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(x, y, s.length * CW, RH); }
  ctx.font = `${weight || 600} 13px "SF Mono", Menlo, monospace`;
  ctx.fillStyle = color; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y + (RH + CAP) / 2);  // capitals centered in the row
}

function drawStars() {
  for (let i = 0; i < 260; i++) {
    const x = noise(i, 1) * 260 - 20, y = noise(i, 2) * 90 - 10;
    ctx.fillStyle = noise(i, 3) < 0.3 ? "#2a323e" : "#1c222b";
    ctx.fillRect(Math.round(sx(x)), Math.round(sy(y)), 2, 2);
  }
}

// A smooth curve through the midpoints of a saved path, sampled in grove units.
function smooth(points) {
  const out = [points[0]];
  for (let i = 1; i < points.length - 1; i++) {
    const a = i === 1 ? points[0] : [(points[i - 1][0] + points[i][0]) / 2, (points[i - 1][1] + points[i][1]) / 2];
    const c = points[i], b = [(points[i][0] + points[i + 1][0]) / 2, (points[i][1] + points[i + 1][1]) / 2];
    for (let t = 0.1; t <= 1.001; t += 0.1) out.push([(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]);

}
// Things along the stream, a cell a character, keyed by STREAM_PAINT; each stands on its bottom
// middle cell. Reeds and tufts on the banks, stones at the water's edge, lily pads on the shallows.
const STREAM_PAINT = {s: "#3a5a2e", d: "#283f22", b: "#4e3824", g: "#4b4f55", G: "#363a40", l: "#2f5a2c", L: "#244522"};
const REEDS = [[".b..", ".b.b", ".s.b", "ss.s", "dsds"], ["b...", "b.b.", "s.s.", "s.ss", "dsds"], ["s.s", "dsd"], ["..s..", "s.s.s", "dsdsd"]];
const STONES = [[".g.", "gGG"], ["gg.", "gGG"]], PADS = [["ll.", "lLl"], ["lll", ".Ll"]];
// Roads, the stream and the blocks' ground are painted once per grove layout into bitmaps of cells
// fixed in grove units, square on screen, and each view only scales those bitmaps onto the screen, so
// panning and zooming never repaint them.
const LAND_CELLS = 3, GROUND_CELLS = 2;  // cells a column across: a third of one for roads and the stream, half for ground
// A bitmap of *per* cells a column, covering grove columns x0 to x1 and rows y0 to y1.
function cellGrid(per, x0, y0, x1, y1) {
  const i0 = Math.floor(x0 * per), j0 = Math.floor(y0 * per * YS);
  const cols = Math.max(1, Math.ceil(x1 * per) - i0), rows = Math.max(1, Math.ceil(y1 * per * YS) - j0), img = new ImageData(cols, rows);
  return {per, i0, j0, cols, rows, img,
    paint: (i, j, c, alpha = 255) => { if (i >= 0 && j >= 0 && i < cols && j < rows) img.data.set([...hex(c), alpha], 4 * (j * cols + i)); },
    map: (i, j) => [(i0 + i + 0.5) / per, (j0 + j + 0.5) / per]};  // a cell's middle in columns both ways, for textures
}
// For each cell of grid *g* within *reach* cells of the line through *points* (grove units): its
// distance to the line, and the stretch of it (an index into *pts*, the line in cells) that is nearest.
function nearLine(g, points, reach) {
  const {cols, rows} = g, near = new Float32Array(cols * rows).fill(Infinity), seg = new Int32Array(cols * rows);
  const pts = smooth(points).map(([x, y]) => [x * g.per - g.i0, y * g.per * YS - g.j0]);
  for (let n = 1; n < pts.length; n++) {
    const [ax, ay] = pts[n - 1], [bx, by] = pts[n], dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1;
    const i0 = Math.max(0, Math.floor(Math.min(ax, bx) - reach)), i1 = Math.min(cols - 1, Math.ceil(Math.max(ax, bx) + reach));
    const j0 = Math.max(0, Math.floor(Math.min(ay, by) - reach)), j1 = Math.min(rows - 1, Math.ceil(Math.max(ay, by) + reach));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const px = i + 0.5, py = j + 0.5, f = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));

// The stream in the map's pixel style, kept as quiet as the ground: deep water and shallows with a
// few faint streaks along the flow, a muddy bank, a little grass, and now and then a reed, stone or
// lily pad at its edges, a row and a half wide.

  const band = 1.5 * YS * g.per, half = band / 2, reach = 2 * half, {near, seg, pts} = nearLine(g, water, reach), {cols, rows, paint} = g;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = j * cols + i;
    if (near[k] >= reach) continue;

    const [wx, wy] = g.map(i, j);
    const [ax, ay] = pts[seg[k] - 1], [bx, by] = pts[seg[k]], l = Math.hypot(bx - ax, by - ay) || 1, tx = (bx - ax) / l, ty = (by - ay) / l;

      paint(i, j, streak > 0.95 && e < 0.7 ? "#2a4c72" : streak > 0.86 ? "#1c3858" : deep ? "#0f2036" : "#142a45");
    } else if (e < 1.15) paint(i, j, patchy(wx * 3, wy * 3, 43) > 0.6 ? "#2f281e" : "#2a241b");
    else if (e < 1.6 && patchy(wx * 2.2, wy * 2.2, 47) > 0.4 + 0.5 * (e - 1.15) / 0.45) {

      if (cx < -band || cx > cols + band || cy < -band || cy > rows + band || kind > 0.5) continue;

      const pick = list => list[Math.floor(noise(n, 15) * list.length)], flip = noise(n, 16) < 0.5;
      place(kind < 0.35 ? pick(REEDS) : kind < 0.42 ? pick(STONES) : pick(PADS), cx, cy, flip);
    }
    walked += len;
