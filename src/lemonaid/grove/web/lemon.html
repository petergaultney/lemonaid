<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>lemon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#0b0e13; color:#e6ebf2; }
:root { --mono:"SF Mono", Menlo, monospace; }
/* Prose reads in the system font; what is laid out by the character (code, drawn cards, tool calls) stays monospaced. */
body { font:13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; }
a { color:#8ab4f8; }
:root { --accent:#f2d94e; --accent-ink:#0b0e13; }  /* the lemon's group color, once its page knows it */
header { display:flex; gap:12px; align-items:center; padding:4px 10px; background:#161b24; white-space:nowrap; overflow:hidden; }
header .home { display:flex; }
header .home img { width:22px; height:22px; }
header .chip { background:var(--accent); color:var(--accent-ink); padding:1px 6px; font-weight:800; overflow:hidden; text-overflow:ellipsis; }
header .status { font-weight:700; padding:1px 8px; border-radius:10px; }
header { border-bottom:3px solid transparent; }  /* in the brief status's color, so it shows from across the room */
header .bid { color:#7c8696; overflow:hidden; text-overflow:ellipsis; }
header #edit { margin-left:auto; font:inherit; color:#8ab4f8; background:none; border:1px solid #2d3442; border-radius:6px; padding:2px 10px; }
/* A phone's buttons, in a bar at the bottom by the thumb; a wider screen keeps the header's icon link. */
nav.tabs { display:none; gap:10px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:#161b24; }
nav.tabs > * { display:flex; align-items:center; justify-content:center; min-height:44px; padding:0 16px; font:inherit; font-size:15px; font-weight:700; background:#2d3442; color:#e6ebf2; border:0; border-radius:8px; text-decoration:none; }
nav.tabs .home { padding:0 9px; background:none; border:2px solid #2d3442; }
nav.tabs .home img { width:30px; height:30px; }
nav.tabs button.on { outline:2px solid var(--accent); outline-offset:-2px; }
nav.tabs button[data-tab=brief] { box-shadow:0 0 0 2px var(--status, transparent); }  /* the brief's status, where the brief is */
nav.tabs .send { margin-left:auto; background:var(--accent); color:var(--accent-ink); }  /* pressed most: bottom right */
body.brief-tab nav.tabs .send { visibility:hidden; }
main { flex:1; display:flex; min-height:0; }
header, form, nav.tabs { flex-shrink:0; }
#brief { flex:0 0 var(--brief, 42%); overflow:auto; padding:8px 14px; outline:none; }
#brief:focus { box-shadow:inset 2px 0 0 var(--accent); }
#divider { flex:0 0 6px; cursor:col-resize; background:#3a4250; touch-action:none; }
#divider:hover, #divider.dragging { background:var(--accent); }
#chat { flex:1; display:flex; flex-direction:column; min-width:0; }
#log { flex:1; overflow:auto; padding:8px 14px 20px; }
.entry { margin:0 0 10px; overflow-wrap:anywhere; }
.entry .who { color:#7c8696; font-size:11px; }
.day { color:#7c8696; font-size:11px; text-align:center; margin:14px 0 8px; border-top:1px solid #262c36; padding-top:4px; }
.entry.user .body { background:#1f2a3a; border-left:3px solid var(--accent); padding:4px 8px; }
.entry.pending { opacity:0.55; }
.entry .sent { color:#f2c14e; }
.entry.failed .who { color:#e5534b; }
.entry.failed .body { border-left:3px solid #e5534b; padding:4px 8px; color:#f19990; }
.entry.other .body { border-left:3px solid #3a4250; padding:4px 8px; color:#aab3c2; }
.entry.tool { color:#7c8696; font-size:11px; font-family:var(--mono); margin:0 0 4px; }
.entry.tool summary { cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.entry.tool .tools div { white-space:pre-wrap; margin:2px 0 2px 12px; }
.problem { color:#f2c14e; }
pre.drawn { white-space:pre-wrap; margin:0 0 12px; font-size:inherit; font-family:var(--mono); line-height:1.35; background:none; padding:0; overflow:visible; }
#brief pre.drawn a { color:inherit; }
#brief .session { background:#2b3a55; color:#e6ebf2; font-weight:700; text-align:center; margin:0 0 10px; padding:1px 0; }
#brief .needs blockquote { border-left:3px solid #e3cf65; color:#e3cf65; margin:0 0 12px; padding:2px 10px; background:#14161b; }
#brief .needs.held blockquote { border-left-color:#5a6270; color:#8b93a1; }
#brief .files { color:#7c8696; }
#brief hr { border:0; border-top:1px solid #3a4250; margin:12px 0; }
#brief a { color:#6cb6ff; }
#brief details.summary summary { cursor:pointer; color:#aab3c2; }
pre, code { font-family:var(--mono); }
pre { background:#161b24; padding:6px 8px; overflow:auto; white-space:pre-wrap; }
code { background:#161b24; padding:0 3px; }
h1,h2,h3,h4 { color:#f2d94e; margin:12px 0 4px; font-size:14px; }
ul { margin:4px 0; padding-left:20px; }
blockquote { margin:8px 0; padding:2px 12px; border-left:3px solid #f2c14e; background:#161b24; }
p { margin:6px 0; }
table { border-collapse:collapse; margin:4px 0; } td { border:1px solid #3a4250; padding:1px 6px; }
/* The composer, as chat apps draw one: what's attached above a rounded box that grows with what you
   type, a paperclip at its left and a round send at its right. */
form { display:flex; flex-direction:column; gap:6px; padding:8px 10px; background:#161b24; border-top:1px solid #222936; }
#said:empty, #how:empty { display:none; }
#said { color:#f2c14e; font-size:12px; padding:0 6px; }
#how { color:#7c8696; font-size:12px; padding:0 6px; }
.compose { display:flex; align-items:flex-end; gap:6px; background:#0b0e13; border:1px solid #2d3442; border-radius:20px; padding:4px; transition:border-color .15s; }
.compose:focus-within { border-color:#5a6270; }
form.dropping .compose { border-color:var(--accent); border-style:dashed; }
textarea { flex:1; box-sizing:border-box; font:inherit; line-height:1.4; background:none; color:#e6ebf2; border:0; outline:none; resize:none; padding:7px 4px; min-height:1.4em; max-height:40vh; overflow-y:auto; }
textarea::placeholder { color:#6b7484; }
.compose button { flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:34px; height:34px; border:0; border-radius:50%; padding:0; cursor:pointer; }
.compose button svg { width:20px; height:20px; }
.compose .attach { background:none; color:#aab3c2; }
.compose .attach:hover { background:#1f2633; color:#e6ebf2; }
.compose .send { background:var(--accent); color:var(--accent-ink); }
/* Attachments: images as thumbnails, other files as cards, each with a round remove in its corner. */
#attached { display:flex; gap:10px; overflow-x:auto; padding:8px 4px 2px; scrollbar-width:thin; }
#attached .tile { position:relative; flex:0 0 auto; height:64px; border-radius:12px; background:#1f2633; border:1px solid #2d3442; }
#attached .tile.image { width:64px; }
#attached .tile.image .thumb { width:100%; height:100%; object-fit:cover; border-radius:11px; display:block; }
#attached .tile.file { display:flex; align-items:center; gap:10px; padding:0 14px 0 10px; max-width:220px; }
#attached .kind { flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:38px; height:44px; border-radius:6px; background:#2b3a55; color:#cfe0ff; font-size:10px; font-weight:800; letter-spacing:.03em; }
#attached .about { display:flex; flex-direction:column; min-width:0; }
#attached .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#e6ebf2; }
#attached .size { color:#7c8696; font-size:11px; }
#attached .remove { position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:50%; border:2px solid #161b24; background:#5a6270; color:#fff; font:700 13px/1 system-ui, sans-serif; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; }
#attached .remove::after { content:""; position:absolute; inset:-10px; }  /* a thumb-sized target around the small dot */
#attached .remove:hover { background:#e5534b; }
#attached .tile.uploading > :not(.spinner) { opacity:0.45; }
@keyframes spin { to { transform:rotate(360deg); } }
#attached .spinner { position:absolute; top:50%; left:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border:2px solid #e6ebf2; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
.entry .sent-files { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.entry .sent-files img { width:56px; height:56px; object-fit:cover; border-radius:8px; display:block; }
.entry .sent-files .card { display:inline-flex; align-items:center; gap:8px; max-width:100%; background:#161b24; border:1px solid #2d3442; border-radius:8px; padding:4px 10px 4px 4px; color:#cdd5e0; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.entry .sent-files .card b { flex:0 0 auto; background:#2b3a55; color:#cfe0ff; border-radius:5px; padding:4px 5px; font-size:9px; letter-spacing:.03em; }
@keyframes pulse { 50% { opacity:0.35; } }
#dot { flex:0 0 9px; height:9px; border-radius:50%; background:#e6ebf2; animation:pulse 1.6s ease-in-out infinite; }
.entry.working { color:#c9a23a; display:flex; align-items:center; gap:4px; }
.entry.working i { width:5px; height:5px; border-radius:50%; background:currentColor; animation:pulse 1.2s ease-in-out infinite; }
.entry.working i:nth-child(2) { animation-delay:0.2s; } .entry.working i:nth-child(3) { animation-delay:0.4s; margin-right:4px; }
[hidden] { display:none !important; }
@media (max-width: 760px) {
  nav.tabs { display:flex; }
  body { position:fixed; inset:0; font-size:15px; }  /* only the brief and chat scroll, never the bars off the screen */
  header .home { display:none; }
  header { flex-wrap:wrap; row-gap:2px; }
  .compose .send { display:none; }  /* the bottom bar's send stands in for it */
  .compose button { width:38px; height:38px; }
  textarea { font-size:16px; }  /* below 16px, a phone zooms the page into the box */
  #brief { flex:1; }
  #divider { display:none; }
  body.chat-tab #brief, body.brief-tab #chat { display:none; }
}
</style></head><body class="chat-tab">
<header><a class="home" href="./" onclick="event.preventDefault(); window.groveHome()" title="back to the grove"><img src="icon.svg" alt="lemonaid"></a><span id="dot" title="mid-turn" hidden></span><span class="chip" id="name"></span><span class="status" id="status"></span><span class="bid" id="bid"></span><button id="edit" type="button" hidden>edit</button></header>
<main>
<section id="brief" tabindex="-1"></section>
<div id="divider" title="drag to size the brief"></div>
<section id="chat"><div id="log"></div>
<form id="say"><div id="said"></div><div id="attached" hidden></div>
<div class="compose"><button type="button" class="attach" id="attach" title="attach files" aria-label="attach files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button><input type="file" id="pick" multiple hidden><textarea id="text" rows="1" placeholder="Message"></textarea><button type="submit" class="send" id="sendIt" title="send" aria-label="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
<div id="how"></div></form>
</section>
</main>
<nav class="tabs"><a class="home" href="./" onclick="event.preventDefault(); window.groveKey()"><img src="icon.svg" alt="lemonaid"></a><button data-tab="brief">brief</button><button data-tab="chat" class="on">chat</button><button class="send" type="submit" form="say">send</button></nav>
<script>
const channel = new URLSearchParams(location.search).get("channel") || "";
// The page's own elements, found once before any rendered content can carry the same ids.
const own = Object.fromEntries([...document.querySelectorAll("[id]")].map(element => [element.id, element]));
const $ = id => own[id];
const call = async (name, args) => {
  const r = await fetch(`api/${name}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(args)});
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status} ${await r.text()}`);
  return r.json();
};
const escape = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const inline = s => escape(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|obsidian:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
// Enough Markdown for briefs and chat: fences, headings, bullets, paragraphs.
const markdown = text => {
  const out = []; let list = false, table = false, fence = null;
  for (const line of text.split("\n")) {
    if (fence !== null) {
      if (line.startsWith("```")) { out.push(`<pre>${escape(fence.join("\n"))}</pre>`); fence = null; } else fence.push(line);
      continue;
    }
    if (line.startsWith("```")) { fence = []; continue; }
    const row = line.match(/^\s*\|(.*)\|\s*$/);
    if (table && !row) { out.push("</table>"); table = false; }
    if (row) {
      if (/^[\s|:-]+$/.test(row[1])) continue;  // the header's underline
      if (!table) { out.push("<table>"); table = true; }
      out.push(`<tr>${row[1].split("|").map(cell => `<td>${inline(cell.trim())}</td>`).join("")}</tr>`);
      continue;
    }
    const bullet = line.match(/^\s*[-*] (.*)/);
    if (list && !bullet) { out.push("</ul>"); list = false; }
    const heading = line.match(/^(#{1,4}) (.*)/);
    if (heading) out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);
    else if (bullet) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(bullet[1])}</li>`); }
    else if (line.trim()) out.push(`<div>${inline(line)}</div>`);
  }
  if (fence !== null) out.push(`<pre>${escape(fence.join("\n"))}</pre>`);
  if (list) out.push("</ul>");
  if (table) out.push("</table>");
  return out.join("");
};
// Full Markdown, as the tmux sidebar renders it, when the libraries loaded; the small renderer
// above when the browser couldn't reach them.
const rich = text => window.marked && window.DOMPurify
  ? DOMPurify.sanitize(marked.parse(text, {gfm: true, breaks: false}), {
      ALLOWED_URI_REGEXP: /^(?:https?|mailto|obsidian):/i,
      SANITIZE_NAMED_PROPS: true,  // a rendered id or name can't stand in for one of the page's own
      FORBID_TAGS: ["form", "input", "textarea", "button", "select"],
    })
  : markdown(text);
const time = at => at ? new Date(at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
const day = at => {
  if (!at) return "";
  const d = new Date(at), year = d.getFullYear() === new Date().getFullYear() ? {} : {year: "numeric"};
  return d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric", ...year});
};
// Each [at, html] after a heading for its day whenever the day changes.
const byDay = items => {
  let last = "";
  return items.map(([at, html]) => {
    const d = day(at), heading = d && d !== last ? `<div class="day">${escape(d)}</div>` : "";
    last = d || last;
    return heading + html;
  }).join("");
};
const who = e =>({user: "you", lemon: $("name").textContent, other: e.sender || "message", failed: "turn failed"})[e.role] || e.role;
// Each run of tool calls is one collapsed line; which ones you opened survive a refresh.
const opened = new Set();
const toolKey = e => `${e.at}|${e.text}`;
const renderTools = tools => {
  const key = toolKey(tools[0]), names = [...new Set(tools.map(e => e.text.split(/\s/)[0]))].join(", ");
  const summary = tools.length === 1 ? `ran ${tools[0].text}` : `ran ${tools.length} tools: ${names}`;
  return `<details class="entry tool" data-key="${escape(key)}"${opened.has(key) ? " open" : ""}>`
    + `<summary>${escape(summary)}</summary>`
    + `<div class="tools">${tools.map(e => `<div>${escape(e.text)}</div>`).join("")}</div></details>`;
};
const grouped = entries => entries.reduce((out, e) => {
  const last = out[out.length - 1];
  if (e.role === "tool" && last && last.tools) last.tools.push(e);
  else out.push(e.role === "tool" ? {at: e.at, tools: [e]} : {at: e.at, entry: e});
  return out;
}, []).map(g => [g.at, g.tools ? renderTools(g.tools) : render(g.entry)]);
// What a message took with it: an image this browser sent as its thumbnail, any other file as a card.
// The thumbnails are kept by name and size, the most recent few dozen, since the conversation
// records only those.
const thumbsKey = "lemonaid-sent-thumbs";
const sentThumbs = (() => { try { return JSON.parse(localStorage.getItem(thumbsKey)) || {}; } catch { return {}; } })();
const keepThumbs = files => {
  for (const f of files) if (f.thumb) { delete sentThumbs[`${f.name}|${f.size}`]; sentThumbs[`${f.name}|${f.size}`] = f.thumb; }
  const keys = Object.keys(sentThumbs);
  for (const old of keys.slice(0, Math.max(0, keys.length - 40))) delete sentThumbs[old];
  try { localStorage.setItem(thumbsKey, JSON.stringify(sentThumbs)); } catch {}
};
const kindOf = name => (name.includes(".") ? name.split(".").pop().slice(0, 4) : "file").toUpperCase();
const sentFiles = files => !files || !files.length ? "" : `<div class="sent-files">${files.map(f => {
  const thumb = f.thumb || sentThumbs[`${f.name}|${f.size}`] || "";
  return /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(thumb)
    ? `<img src="${thumb}" alt="${escape(f.name)}" title="${escape(f.name)}">`
    : `<span class="card"><b>${escape(kindOf(f.name))}</b>${escape(f.name)}</span>`;
}).join("")}</div>`;
const render = e => `<div class="entry ${e.role}"><div class="who">${escape(who(e))} ${time(e.at)}</div>`
  + `<div class="body">${e.text.trim() ? rich(e.text) : ""}${sentFiles((e.files || []).map(([name, size]) => ({name, size})))}</div></div>`;

// What you sent stays shown, dimmed, until the conversation records it. Kept in this browser,
// so a reload doesn't lose it.
const pendingKey = `lemonaid-pending:${channel}`;
const loadPending = () => { try { return JSON.parse(localStorage.getItem(pendingKey) || "[]"); } catch { return []; } };
const savePending = list => { try { localStorage.setItem(pendingKey, JSON.stringify(list)); } catch {} };
let pending = loadPending();
const {matching, unrecorded, inTime} = window.groveSent;  // sent.js
let lastEntries = [];
const renderPending = p => `<div class="entry user pending"><div class="who">you ${time(new Date(p.at).toISOString())}`
  + (p.unsure ? " \u00b7 may not have been sent: the server didn't answer</div>"
    : ` <span class="sent" title="waiting for the lemon's record of it">\u00b7 sent</span></div>`)
  + `<div class="body">${p.text.trim() ? rich(p.text) : ""}${sentFiles(p.files)}</div></div>`;

$("log").addEventListener("toggle", ev => {
  const key = ev.target.dataset && ev.target.dataset.key;
  if (key) ev.target.open ? opened.add(key) : opened.delete(key);
}, true);
let shownBrief = null, shownLog = null, busy = false;
// The brief as the inbox's brief pane draws it: the server's drawn card, children and files
// (sanitized HTML), and the worker's Markdown between them.
const clean = html => window.DOMPurify
  ? DOMPurify.sanitize(html, {SANITIZE_NAMED_PROPS: true})
  : escape(new DOMParser().parseFromString(html, "text/html").body.textContent);
const drawn = (html, kind = "") => `<pre class="drawn ${kind}">${clean(html)}</pre>`;
const drawSection = s => [
  drawn(s.card),
  s.summary ? `<details class="summary"${s.summary_open ? " open" : ""}><summary>${escape(s.summary_title)}</summary>${rich(s.summary)}</details>` : "",
  s.needs ? `<div class="needs${s.held ? " held" : ""}">${rich(s.needs)}</div>` : "",
  s.body ? rich(s.body) : "",
  s.children ? drawn(s.children) : "",
  s.tail ? rich(s.tail) : "",
].join("");
const drawBrief = b => {
  if (!b || (!b.sections && !b.fallback)) return '<div class="problem">No brief attached.</div>';
  if (b.fallback) return rich(b.fallback);
  return (b.session ? `<div class="session">${escape(b.session)}</div>` : "")
    + (b.header ? rich(b.header) : "")
    + b.sections.map(drawSection).join("<hr>")
    + "<hr>" + drawn(b.files, "files");
};
// How many characters fit across the brief pane, so the server draws the card that wide.
const briefColumns = () => {
  const probe = document.createElement("pre");
  probe.className = "drawn";
  probe.style.cssText = "position:absolute; visibility:hidden; white-space:pre; padding:0";
  probe.textContent = "M".repeat(50);
  document.body.appendChild(probe);
  const each = probe.getBoundingClientRect().width / 50;
  probe.remove();
  const pane = $("brief"), style = getComputedStyle(pane);  // a hidden pane (a phone's chat tab) would be the page's width
  const inner = (pane.clientWidth || document.documentElement.clientWidth)
    - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  return each > 0 && inner > 0 ? Math.floor(inner / each) : 80;
};
// Its edits (edit.js); archived, it is gone from the grove, so the page goes back to it.
let shownView = null;
$("edit").addEventListener("click", () => window.groveEdit(
  {channel, name: shownView.name, pinned: shownView.pinned},
  done => done.gone ? window.groveHome() : refresh(),
));
const showView = v => {
  if (v.error) { $("log").innerHTML = `<div class="problem">${escape(v.error)}</div>`; return; }
  document.title = v.name; $("name").textContent = v.name;
  // "" keeps the yellow
  document.documentElement.style.setProperty("--accent", v.color || "#f2d94e");
  document.documentElement.style.setProperty("--accent-ink", v.ink || "#0b0e13");
  $("status").textContent = v.status || "";
  const tone = {alert: "#e5534b", blocked: "#f2c14e", merge: "#5fbf6a", approve: "#c58af9", review: "#a8794f", running: "#39b5a8", done: "#5a8dee"}[v.status] || "";
  $("status").style.color = tone; $("status").style.background = tone && tone + "2e";
  document.querySelector("header").style.borderBottomColor = tone || "transparent";
  if (tone) document.documentElement.style.setProperty("--status", tone); else document.documentElement.style.removeProperty("--status");
  $("bid").textContent = v.brief_id || "";
  shownView = v; $("edit").hidden = false;
  $("how").textContent = v.how === "mail" ? v.how_text : "";  // only a message that won't arrive as you says how
  $("text").placeholder = `Message ${v.name}`;
  $("attach").hidden = v.attach === false;
  $("dot").hidden = !v.working;
  if (Boolean(v.working) !== working) { working = Boolean(v.working); if (lastTalk) showTalk(lastTalk); }
  const brief = JSON.stringify(v.brief);
  if (brief !== shownBrief) {
    shownBrief = brief;
    $("brief").innerHTML = drawBrief(v.brief);
  }
};
let working = false, lastTalk = null;  // the working row stands where the next reply will appear
const showTalk = c => {
  if (c.error) return;
  lastTalk = c;
  if (!c.conversation_problem) {
    lastEntries = c.entries;
    const left = unrecorded(pending, c.entries);
    if (JSON.stringify(left) !== JSON.stringify(pending)) { pending = left; savePending(pending); }
  }
  const html = (c.conversation_problem ? `<div class="problem">${escape(c.conversation_problem)}</div>` : "")
    + byDay(inTime(c.conversation_problem ? [] : grouped(c.entries),
                   pending.map(p => [new Date(p.at).toISOString(), renderPending(p)])))
    + (working ? `<div class="entry working"><i></i><i></i><i></i>working...</div>` : "");
  if (html !== shownLog) {
    const log = $("log"), atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.innerHTML = shownLog = html;
    if (atEnd) log.scrollTop = log.scrollHeight;
  }
};
// The brief is local and quick; the conversation may come from another process, so each
// shows as soon as it arrives.
// The first refresh notes when each part arrived and the conversation was drawn, in ms since the
// page was asked for, to tell the network from the server from drawing when a page opens slowly.
let timed = false;
let stale = "";  // what a failed refresh put in the message line, cleared by the next to succeed
const refresh = async () => {
  if (busy) return;
  busy = true;
  const at = {};
  const shown = [
    call("lemon", [channel, briefColumns()]).then(v => { at.view = performance.now(); showView(v); }),
    call("talk", [channel]).then(c => {
      at.talk = performance.now(); showTalk(c); at.drawn = performance.now();
      window.groveTalks.keep(channel, c);
    }),
  ];
  const failed = (await Promise.allSettled(shown)).find(result => result.status === "rejected");
  busy = false;
  if (failed) {
    stale = failed.reason instanceof TypeError  // the browser's word for a request nothing answered
      ? "Can't reach the grove; trying again"
      : String(failed.reason);
    $("said").textContent = stale;
    if (window.groveNote) window.groveNote("problem", {message: String(failed.reason)});
  } else if (stale && $("said").textContent === stale) {  // a later message (a send's) stays
    $("said").textContent = "";
    stale = "";
  }
  if (timed || !window.groveNote) return;

  timed = true;
  const page = performance.getEntriesByType("navigation")[0] || {};
  window.groveNote("timing", Object.fromEntries(Object.entries({
    asked: page.requestStart, html: page.responseEnd, scripts: page.domContentLoadedEventEnd, ...at,
  }).map(([k, v]) => [k, Math.round(v || 0)]).concat([["kept", Boolean(kept)]])));
};

// What you've attached and haven't sent (attach.js), shown above the box.
const attached = window.groveAttach(channel, $("attached"), line => { $("said").textContent = line; });
const send = async () => {
  if (attached.busy()) { $("said").textContent = "wait for the files to finish uploading"; return; }

  const text = $("text").value, files = attached.files(), ids = attached.ids();
  const seen = matching(text, lastEntries);  // before the send can be recorded
  $("said").textContent = "sending...";
  try {
    const problem = await call("say", [channel, text, ids]);
    $("said").textContent = problem;
    if (!problem) {
      $("text").value = "";
      keepDraft();
      attached.forget(ids);  // what was attached while it sent stays
      keepThumbs(files);
      pending = [...pending, {text, files, at: Date.now(), seen}];
      savePending(pending);
      shownLog = null;
      $("log").scrollTop = $("log").scrollHeight;
    }
  } catch (error) {  // the request may have reached the server, so resending could say it twice
    $("said").textContent = `${error}; check the conversation before sending again`;
    $("text").value = "";
    keepDraft();
    attached.forget(ids);  // what was attached while it sent stays
    pending = [...pending, {text, files, at: Date.now(), seen, unsure: true}];
    savePending(pending);
    shownLog = null;
  }
  refresh();
};
// Files come from the attach button, a paste into the box, or a drop on the form; none sends.
$("attach").addEventListener("click", () => $("pick").click());
$("pick").addEventListener("change", () => { attached.add($("pick").files); $("pick").value = ""; });
$("text").addEventListener("paste", event => {
  const files = event.clipboardData && event.clipboardData.files;
  if (files && files.length) { event.preventDefault(); attached.add(files); }
});
$("say").addEventListener("dragover", event => { event.preventDefault(); $("say").classList.add("dropping"); });
$("say").addEventListener("dragleave", () => $("say").classList.remove("dropping"));
$("say").addEventListener("drop", event => {
  event.preventDefault();
  $("say").classList.remove("dropping");
  if (event.dataTransfer.files.length) attached.add(event.dataTransfer.files);
});
// What you typed and haven't sent, kept in this browser for each lemon, so leaving the page or
// reloading it doesn't lose it.
const draftKey = `lemonaid-draft:${channel}`;
// The box grows with what's in it, up to its max-height, and shrinks again once it's sent.
const fit = () => { const box = $("text"); box.style.height = "auto"; box.style.height = `${box.scrollHeight}px`; };
const keepDraft = () => {
  fit();
  try { if ($("text").value) localStorage.setItem(draftKey, $("text").value); else localStorage.removeItem(draftKey); } catch {}
};
try { $("text").value = localStorage.getItem(draftKey) || ""; } catch {}
fit();
$("text").addEventListener("input", keepDraft);
// Arriving at a lemon, by a jump, a reload or going back, puts you in its box, after any draft.
const toBox = () => { const box = $("text"); box.focus(); box.setSelectionRange(box.value.length, box.value.length); };
toBox();
addEventListener("pageshow", toBox);
$("say").addEventListener("submit", event => { event.preventDefault(); send(); });
$("text").addEventListener("keydown", event => {
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) { event.preventDefault(); send(); }
});
const showTab = tab => {
  document.body.className = `${tab}-tab`;
  for (const each of document.querySelectorAll(".tabs button[data-tab]")) each.classList.toggle("on", each.dataset.tab === tab);
};
for (const button of document.querySelectorAll(".tabs button[data-tab]")) button.addEventListener("click", () => { showTab(button.dataset.tab); if (button.dataset.tab === "chat") toBox(); });
// The prefix key's brief key (prefix.js): the brief, focused so the arrow keys scroll it.
document.addEventListener("grove-brief", () => { showTab("brief"); $("brief").focus(); });
// The brief's share of the width, dragged on the divider and kept in this browser.
const sizeKey = "lemonaid-brief-width";
const setBrief = percent => document.body.style.setProperty("--brief", `${Math.min(80, Math.max(15, percent))}%`);
try { const kept = Number(localStorage.getItem(sizeKey)); if (kept) setBrief(kept); } catch {}
$("divider").addEventListener("pointerdown", down => {
  const divider = $("divider"), main = divider.parentElement.getBoundingClientRect();
  divider.setPointerCapture(down.pointerId);
  divider.classList.add("dragging");
  let percent = null;
  const move = event => { percent = (event.clientX - main.left) / main.width * 100; setBrief(percent); };
  const up = () => {
    divider.classList.remove("dragging");
    divider.removeEventListener("pointermove", move);
    try { if (percent !== null) localStorage.setItem(sizeKey, String(Math.min(80, Math.max(15, percent)))); } catch {}
  };
  divider.addEventListener("pointermove", move);
  divider.addEventListener("pointerup", up, {once: true});
});

// The server says when the conversation or the brief's file changed, over a stream it keeps open.
// While the stream is down, or this browser has none to spare, the page asks every few seconds; and
// now and then regardless, for the brief's PRs, which change on their own.
let told = null;
const listen = () => {
  told = new EventSource(`api/talk-changes?${new URLSearchParams({channel})}`);
  told.onmessage = refresh;
  told.onopen = refresh;  // whatever changed while it was closed
};
// What this phone kept of the conversation, drawn while the page asks for what changed (talks.js).
const kept = window.groveTalks.kept(channel);
if (kept) showTalk(kept);
refresh();
listen();
setInterval(() => { if (told.readyState !== EventSource.OPEN) refresh(); }, 4000);
setInterval(refresh, 60000);
// Leaving closes the stream, so the browser may keep the page to show again, and coming back opens it.
addEventListener("pagehide", () => told.close());
addEventListener("pageshow", event => { if (event.persisted) listen(); });
</script>
</body></html>
