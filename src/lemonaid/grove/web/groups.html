<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>lemonaid</title>
<style>
html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; background:#0b0e13; color:#e6ebf2; }
/* Held to the screen's edges, and only the list scrolls, so nothing moves the bars off the screen.
   The keyboard shrinks the page (interactive-widget in the viewport) rather than sliding it up. */
body { font:15px/1.4 "SF Mono", Menlo, monospace; display:flex; flex-direction:column; position:fixed; inset:0; }
a { color:inherit; text-decoration:none; }
/* What only informs is at the top; what you press is in the bar at the bottom, by your thumb. */
header { flex-shrink:0; }
header { display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; padding:8px 14px; background:#161b24; }
header .more { grid-row:1 / 3; grid-column:2; display:flex; padding:6px; margin:-6px; color:#c9d1dc; }
header .chip { align-self:flex-start; max-width:100%; box-sizing:border-box; background:#f2d94e; color:#0b0e13; padding:1px 8px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#sum { color:#7c8696; font-size:13px; }
/* The list starts at the bottom, its most pressing row lowest, and scrolls up. */
main { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column-reverse; padding-bottom:4px; }
.chips { flex:0 0 auto; display:flex; gap:4px; }
.chips span { display:flex; align-items:center; gap:4px; padding:1px 7px; border-radius:10px; font-size:13px; font-weight:700; }
.chips .new { min-width:20px; justify-content:center; box-sizing:border-box; color:#0b0e13; background:#f2d94e; font-weight:800; }
.chips .idle { color:#5a6270; font-weight:500; }
.chips .busy { color:#e6ebf2; background:#2d3442; }
.chips .busy i { width:7px; height:7px; border-radius:50%; background:#e6ebf2; animation:pulse 1.6s ease-in-out infinite; }
.row { display:flex; gap:12px; align-items:center; min-height:52px; padding:8px 14px; border-top:1px solid #1d232e; }
.row:first-child { border-bottom:1px solid #1d232e; }  /* the lowest, as the list starts at the bottom */
.row:active { background:#161b24; }
.swatch { flex:0 0 6px; align-self:stretch; border-radius:3px; }
.dot { flex:0 0 12px; height:12px; border-radius:50%; }
.dot.working { animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:0.35; } }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.name { font-weight:500; color:#b4bcc8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sub { color:#7c8696; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sub span + span::before { content:"  "; white-space:pre; }
.trail { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.age { color:#7c8696; font-size:13px; line-height:16px; white-space:nowrap; }
.badge { width:10px; height:10px; border-radius:50%; }
.row.new .name { font-weight:800; color:#f4f6fa; }
.row.new .age { color:#f2d94e; font-weight:700; }
.row.new .badge { background:#f2d94e; }
.problem { color:#e5534b; padding:14px; }
</style>
</head><body>
<header><span class="chip" id="title"></span><a class="more" href="settings" title="settings" aria-label="settings"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="8.6" stroke-width="3.2" stroke-dasharray="3.38 3.38"/><circle cx="12" cy="12" r="5.6" stroke-width="3.6"/></svg></a><span id="sum"></span></header>
<main id="list"></main>
<nav id="nav"></nav>
<script>
// A phone's grove: the groups, then the lemons of one, each opening its lemon's page. The group shown
// is in the address, so the browser's back button leaves it, and coming back from a lemon's page by
// its "grove" link shows the group that lemon was opened from.
const STATUS = window.groveBar.STATUS;
const RANK = ["alert", "blocked", "merge", "approve", "review", "running", "done"];
const OPEN = "lemonaid-group";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const named = b => b.group || b.home || "packhouse";  // block 0 is the home group's when one is set
const lemonsOf = b => b.trees.flatMap(t => t.lemons);
const ORDER = [...RANK.filter(s => s !== "done"), "", "done"];  // what a lemon asks for first, done last
const rank = l => ORDER.indexOf(STATUS[l.status] ? l.status : "");
const remember = name => { try { name === null ? sessionStorage.removeItem(OPEN) : sessionStorage.setItem(OPEN, name); } catch {} };
const remembered = () => { try { return sessionStorage.getItem(OPEN); } catch { return null; } };
let DATA = null, PINS = [], drawn = "", inBar = [];  // inBar: the bar's lemons as last drawn  // PINS: the inbox's pinned channels, in its order
// The last groups the server sent, kept on this phone to draw at once and while it can't be reached.
const KEPT = "lemonaid-groups";
let keptAt = 0, offline = false;  // keptAt: when the groups shown were read

function opened() {
  const name = new URLSearchParams(location.hash.slice(1)).get("group");
  return name === null ? null : DATA.blocks.find(b => named(b) === name) || null;
}

// How many of the group's lemons are mid-turn, then how many have each status, most pressing first,
// each in its status's color, those with none a dim ○; last, how many are unread, as a solid badge.
function tally(b) {
  const lemons = lemonsOf(b), working = lemons.filter(l => l.working).length, unread = lemons.filter(l => l.unread).length;
  const chips = ORDER.map(s => [s, lemons.filter(l => (STATUS[l.status] ? l.status : "") === s).length])
    .filter(([, n]) => n)
    .map(([s, n]) => s ? `<span title="${s}" style="color:${STATUS[s]};background:${STATUS[s]}2e">${n}</span>` : `<span class="idle" title="no status">○${n}</span>`);
  return `<span class="chips">${working ? `<span class="busy" title="mid-turn"><i></i>${working}</span>` : ""}${chips.join("")}${unread ? `<span class="new" title="unread">${unread}</span>` : ""}</span>`;
}

// Most pressing first, which the list draws lowest: by its most pressing lemon, then how many are mid-turn, then how many are unread.
const urgency = b => [Math.min(ORDER.length, ...lemonsOf(b).map(rank)), -lemonsOf(b).filter(l => l.working).length, -lemonsOf(b).filter(l => l.unread).length, b.digit];
const before = (x, y) => { for (const [a, c] of x.map((v, i) => [v, y[i]])) if (a !== c) return a < c ? -1 : 1; return 0; };

function groupRows() {
  return [...DATA.blocks].sort((x, y) => before(urgency(x), urgency(y))).map(b => `<a class="row" href="#group=${encodeURIComponent(named(b))}"${b.group || b.home ? ` data-group="${esc(b.group || b.home)}" data-hold` : ""}>
    <span class="swatch" style="background:${esc(b.color)}"></span>
    <span class="main"><span class="name">${esc(named(b))}</span></span>${tally(b)}</a>`).join("");
}

function lemonRows(b) {
  const lemons = lemonsOf(b).sort((x, y) => rank(x) - rank(y) || y.working - x.working || y.updated - x.updated);
  return lemons.map(l => {
    const color = STATUS[l.status] || "#9aa3ad";
    const sub = [
      l.status ? `<span style="color:${color}">${esc(l.status)}</span>` : "",
      l.brief_id ? `<span>${esc(l.brief_id)}</span>` : "",
      ...(l.prs || []).map(([number]) => `<span>#${esc(number)}</span>`),
    ].join("");
    return `<a class="row${l.unread ? " new" : ""}" href="lemon?channel=${encodeURIComponent(l.channel)}" data-channel="${esc(l.channel)}" data-hold>
      <span class="dot${l.working ? " working" : ""}" style="background:${color}"></span>
      <span class="main"><span class="name">${esc(l.emoji)}${l.emoji ? " " : ""}${esc(l.name)}</span><span class="sub">${sub || "<span>idle</span>"}</span></span>
      <span class="trail"><span class="age">${esc(l.age === "just now" ? "now" : l.age.replace(/ ago$/, ""))}</span><span class="badge"${l.unread ? ' title="unread"' : ""}></span></span></a>`;
  }).join("");
}

function draw() {
  if (!DATA) return;
  const b = opened();
  remember(b ? named(b) : null);
  const title = b ? named(b) : "lemonaid";
  let nav = "";
  if (!DATA.error) {
    let last = null;
    try { last = localStorage.getItem("lemonaid-last-lemon"); } catch {}
    ({html: nav, lemons: inBar} = window.groveBar.draw(DATA.blocks, PINS, b ? "the groups" : last ? "the last lemon" : ""));
  }
  const body = DATA.error ? `<div class="problem">${esc(DATA.error)}</div>` : b ? lemonRows(b) : groupRows();
  const summary = offline ? window.groveTalks.offline(keptAt) : DATA.summary || "";
  const page = [title, summary, nav, body, b ? b.color : ""].join("\u0000");
  if (page === drawn) return;
  drawn = page;
  const [t, sum, n, list] = page.split("\u0000");
  const chip = document.getElementById("title");
  chip.textContent = t;
  chip.style.background = b ? b.color : ""; chip.style.color = b ? b.ink : "";  // a group's page is in its color
  document.getElementById("sum").textContent = sum;
  document.getElementById("nav").innerHTML = n;
  document.getElementById("list").innerHTML = list;
}

// The group last shown in this tab, once the groups are known.
function reopen() {
  if (DATA && !location.hash && remembered() !== null && DATA.blocks.some(b => named(b) === remembered())) {
    history.replaceState(null, "", `#group=${encodeURIComponent(remembered())}`);
  }
}

async function refresh() {
  try {
    const ask = name => fetch(`api/${name}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: "[]"});
    const [r, p] = await Promise.all([ask("data"), ask("pins")]);
    if (!r.ok) throw new Error(`data: HTTP ${r.status}`);
    DATA = await r.json();
    if (p.ok) PINS = await p.json();
    offline = false;
    keptAt = Date.now();
    if (!DATA.error) { try { localStorage.setItem(KEPT, JSON.stringify({data: DATA, pins: PINS, at: keptAt})); } catch {} }
  } catch (e) {
    offline = Boolean(DATA);
    if (window.groveNote) window.groveNote("problem", {message: String(e)});
  }
  reopen();
  draw();
  readAhead();
  sweep();
}

// Closes the notifications of lemons read since, which a push couldn't clear while the phone was off.
function sweep() {
  if (!DATA || DATA.error || offline || !("serviceWorker" in navigator)) return;
  const read = new Set(DATA.blocks.flatMap(lemonsOf).filter(l => !l.unread).map(l => l.channel));
  navigator.serviceWorker.getRegistration().then(r => r ? r.getNotifications() : [])
    .then(ns => ns.filter(n => read.has(n.tag)).forEach(n => n.close())).catch(() => {});
}

// The bar's lemons and the lemon last opened, read ahead so their pages draw at once (talks.js).
let reading = false;
async function readAhead() {
  if (reading || !DATA || DATA.error || offline) return;
  reading = true;
  let last = "";
  try { last = new URLSearchParams(localStorage.getItem("lemonaid-last-lemon") || "").get("channel") || ""; } catch {}
  const all = DATA.blocks.flatMap(lemonsOf);
  const ahead = [all.find(l => l.channel === last), ...inBar].filter(Boolean);
  await window.groveTalks.ahead([...new Map(ahead.map(l => [l.channel, l])).values()]);
  reading = false;
}

// Up from a group to the groups, for the home button and keys (prefix.js); false on the groups.
window.groveUp = () => {
  if (!opened()) return false;
  location.hash = "";
  return true;
};
// A lemon's page asked for the groups (prefix.js), even if this list comes back showing a group.
const goUp = () => {
  let up = null;
  try { up = sessionStorage.getItem("lemonaid-up"); sessionStorage.removeItem("lemonaid-up"); } catch {}
  if (up) { remember(null); if (location.hash) history.replaceState(null, "", location.pathname); draw(); }
  return Boolean(up);
};
addEventListener("pageshow", goUp);
addEventListener("resize", draw);
addEventListener("hashchange", () => { draw(); document.getElementById("list").scrollTop = 0; });  // its bottom
document.addEventListener("click", e => {
  const row = e.target.closest("[data-channel]");
  if (row && window.groveNote) window.groveNote("jump", {channel: row.dataset.channel});
});
// Holding a lemon, in a group or in the bar, or a group in the list, opens its edits (edit.js); the grove's changes redraw it.
window.groveHold(el => {
  if (el.dataset.group) return window.groveGroupEdit(el.dataset.group, refresh);
  const l = DATA && DATA.blocks.flatMap(lemonsOf).find(l => l.channel === el.dataset.channel);
  if (l) window.groveEdit({channel: l.channel, name: l.name, pinned: PINS.includes(l.channel), unread: l.unread});
});
try {
  const kept = JSON.parse(localStorage.getItem(KEPT));
  if (kept) { DATA = kept.data; PINS = kept.pins || []; keptAt = kept.at; reopen(); draw(); }
} catch {}
const changes = new EventSource("api/changes");  // the server says when the grove changed (changes.py)
changes.onmessage = refresh;
changes.onopen = refresh;
setInterval(() => { if (changes.readyState !== EventSource.OPEN) refresh(); }, 3000);
</script>
</body></html>
