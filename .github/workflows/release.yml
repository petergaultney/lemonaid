name: release

# Daily, and on demand from the Actions tab or `gh workflow run release.yml`. A run first
# finishes the highest v* tag if it has no published GitHub Release (an earlier run failed
# partway). Otherwise it takes the newest main commit whose tests passed and, if change
# files were added since the highest tag, tags that commit with the next version. The
# tagged build is published to PyPI as lemonaid-inbox and given a GitHub Release whose
# notes are those files. It never commits to main.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag
      actions: read # to find the newest commit whose tests passed
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(uv run --no-project scripts/release.py latest)
          published=$(gh release view "v$latest" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft | not' 2>/dev/null || echo false)
          if [ "$published" != "true" ]; then
            echo "v$latest is tagged but has no published Release: finishing it"
            {
              echo "release=true"
              echo "version=$latest"
              echo "previous=$(uv run --no-project scripts/release.py latest --below "$latest")"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ]; then
            echo "no main commit has passed the test workflow"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=0
          version=$(uv run --no-project scripts/release.py version --since "v$latest" --until "$sha") || status=$?
          if [ "$status" -eq 2 ]; then
            echo "nothing to release at $sha"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"

          # Fails, rather than moving it, if the tag already exists.
          git push origin "$sha:refs/tags/v$version"
          {
            echo "release=true"
            echo "version=$version"
            echo "previous=$latest"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v${{ needs.plan.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          uv build
          # hatch-vcs takes the version from the tag; a dev version here means it didn't.
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep -qx "Version: $VERSION"
      - env:
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          status=0
          uv run --no-project scripts/release.py notes --since "v$PREVIOUS" --until "v$VERSION" > release-notes.md || status=$?
          if [ "$status" -eq 2 ]; then
            # A version from before changes/ existed.
            uv run --no-project scripts/changelog-section.py "$VERSION" > release-notes.md
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            dist/
            release-notes.md

  pypi:
    needs: [plan, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lemonaid-inbox/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # A run finishing a tag must not fail on files an earlier run uploaded.
          skip-existing: true

  github-release:
    needs: [plan, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # A draft means an earlier run failed partway: finish it instead.
          draft=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = "true" ]; then
            gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false
          else
            gh release create "v$VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "v$VERSION" \
              --notes-file release-notes.md
          fi
