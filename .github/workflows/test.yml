name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # The tmux restore drills run one at a time in their own process: in parallel they
      # starve each other and time out. The rest of the suite uses the other three workers.
      - run: |
          run_pytest() { uv run --with pytest-github-actions-annotate-failures pytest -q -rs "$@"; }
          run_pytest -n 3 --ignore=tests/restore & others=$!
          run_pytest tests/restore & restore=$!
          status=0
          wait "$others" || status=1
          wait "$restore" || status=1
          exit "$status"

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/grove/window/layout.test.js tests/grove/window/drag.test.js tests/grove/window/keys.test.js tests/grove/window/page.test.js tests/grove/web/shim.test.js tests/grove/web/vaults.test.js tests/grove/web/attach.test.js
