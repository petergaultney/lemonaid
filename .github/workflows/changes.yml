name: changes

# A PR adds one change file to changes/ and leaves the version, CHANGES.md and older
# change files alone. See changes/README.md. A PR that changes neither
# src/ nor docs/for-lemons.md needs no entry.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  change-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-project scripts/check-change-file.py "$BASE"
